name: Remote probe PI-21

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe invoice PI-2026-00021
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/future-account
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod cp scripts/_tmp-probe-pi21.php backend:/tmp/probe-pi21.php
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php /tmp/probe-pi21.php

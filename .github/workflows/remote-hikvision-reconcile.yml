name: Remote HIKVISION reconcile

on:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile PR-2430 vs purchase invoices
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/future-account
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan tinker --execute='
            $ret=\App\Models\PurchaseReturn::query()->with(["supplier","allocations.invoice","invoice"])->where("status","posted")->where(function($q){$q->where("total",2430)->orWhere("return_number","like","%00001%");})->orderBy("id")->first();
            if(!$ret){echo "RETURN_NOT_FOUND".PHP_EOL; return;}
            $s=$ret->supplier;
            echo "=== RETURN ===".PHP_EOL;
            echo "number={$ret->return_number} total={$ret->total} applied={$ret->applied_amount} refund={$ret->refund_amount}".PHP_EOL;
            echo "linked=".($ret->invoice->invoice_number ?? "null").PHP_EOL;
            echo "supplier={$s->name} id={$s->id}".PHP_EOL;
            echo "=== ALLOCATIONS ===".PHP_EOL;
            foreach($ret->allocations as $a){$i=$a->invoice; $rem=$i?round((float)$i->total-(float)$i->paid_amount,2):null; echo "alloc={$a->amount} -> ".($i->invoice_number??"?")." total=".($i->total??"")." paid=".($i->paid_amount??"")." rem={$rem}".PHP_EOL;}
            echo "=== PURCHASE INVOICES ===".PHP_EOL;
            $invs=\App\Models\PurchaseInvoice::query()->where("supplier_id",$s->id)->where("status","posted")->orderBy("id")->get();
            $sumT=0;$sumP=0;$sumR=0;
            foreach($invs as $i){$rem=round((float)$i->total-(float)$i->paid_amount,2); $sumT+=(float)$i->total; $sumP+=(float)$i->paid_amount; $sumR+=$rem; echo "{$i->invoice_number}\ttype={$i->payment_type}\ttotal={$i->total}\tpaid={$i->paid_amount}\trem={$rem}".PHP_EOL;}
            echo "COUNT=".count($invs)." SUM_TOTAL=".round($sumT,2)." SUM_PAID=".round($sumP,2)." SUM_REMAINING=".round($sumR,2).PHP_EOL;
            echo "=== PAYMENTS ===".PHP_EOL;
            $pays=\App\Models\SupplierPayment::query()->where("supplier_id",$s->id)->where("status","posted")->orderBy("id")->get();
            $sumPay=0; foreach($pays as $p){$sumPay+=(float)$p->amount; echo "{$p->payment_number}\tamount={$p->amount}\tinv=".($p->purchase_invoice_id??"null").PHP_EOL;}
            echo "SUM_PAYMENTS=".round($sumPay,2).PHP_EOL;
            $bal=app(\App\Services\PurchaseService::class)->supplierBalance($s);
            $st=app(\App\Services\PurchaseService::class)->supplierStatement($s);
            echo "=== RECONCILE ===".PHP_EOL;
            echo "supplierBalance={$bal}".PHP_EOL;
            echo "statement_closing={$st["closing_balance"]}".PHP_EOL;
            echo "invoices_total - payments - return = ".round($sumT-$sumPay-(float)$ret->total,2).PHP_EOL;
            echo "diff balance vs remainings = ".round((float)$bal-$sumR,2).PHP_EOL;
            '

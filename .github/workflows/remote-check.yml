name: Remote check

on:
  workflow_dispatch:

jobs:
  google-backup-status:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Google Drive backup config
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/future-account
            echo "HEAD=$(git rev-parse --short HEAD)"
            echo "=== .env.prod Google keys ==="
            for k in GOOGLE_DRIVE_OAUTH_CLIENT_ID GOOGLE_DRIVE_OAUTH_CLIENT_SECRET GOOGLE_DRIVE_OAUTH_REDIRECT_URI FRONTEND_URL APP_URL; do
              line=$(grep -E "^${k}=" .env.prod | head -1 || true)
              if [ -z "$line" ]; then
                echo "${k}=MISSING"
                continue
              fi
              val="${line#*=}"
              val="${val%\"}"
              val="${val#\"}"
              if [ -z "$val" ]; then
                echo "${k}=EMPTY"
              elif [ "$k" = "GOOGLE_DRIVE_OAUTH_CLIENT_ID" ] || [ "$k" = "GOOGLE_DRIVE_OAUTH_CLIENT_SECRET" ]; then
                echo "${k}=SET(len=${#val})"
              else
                echo "${k}=${val}"
              fi
            done
            echo "=== app status ==="
            docker exec future_account_api php artisan tinker --execute='$st=app(App\Services\BackupDistributionService::class)->googleDriveStatus(); echo "oauth_available=".(($st["oauth_available"]??false)?"1":"0")." oauth_connected=".(($st["oauth_connected"]??false)?"1":"0")." configured=".(($st["configured"]??false)?"1":"0")." rclone_available=".(($st["rclone_available"]??false)?"1":"0")." method=".($st["method"]??"null").PHP_EOL; echo "redirect_uri=".app(App\Services\GoogleDriveOAuthService::class)->redirectUri().PHP_EOL;'
            echo "=== rclone ==="
            docker exec future_account_api sh -c 'command -v rclone || echo rclone_MISSING; rclone version 2>/dev/null | head -1 || true'

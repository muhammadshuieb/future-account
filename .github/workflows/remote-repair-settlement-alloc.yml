name: Remote repair settlement allocations

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy migrate and repair unallocated settlements
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/future-account
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            DEPLOY_ENV=prod ./scripts/deploy.sh || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate --no-deps backend
            sleep 8
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan migrate --force
            echo "=== DRY supplier payments ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-supplier-payment-allocation --dry-run
            echo "=== APPLY supplier payments ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-supplier-payment-allocation
            echo "=== DRY receipts ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-receipt-allocation --dry-run
            echo "=== APPLY receipts ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-receipt-allocation

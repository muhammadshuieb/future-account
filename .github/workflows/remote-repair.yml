name: Remote repair

on:
  workflow_dispatch:

jobs:
  repair-sales-return-credit:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy status + repair Abd al-Qader credit
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/future-account
            echo "HEAD=$(git rev-parse --short HEAD)"
            echo "FULL=$(git rev-parse HEAD)"
            echo "=== contains 3ec8aee? ==="
            git merge-base --is-ancestor 3ec8aee HEAD && echo "YES 3ec8aee is deployed" || echo "NO 3ec8aee missing"
            echo "=== migrate status (sales_return) ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan migrate:status 2>/dev/null | grep -i sales_return || true
            echo "=== DRY RUN ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-sales-return-credit --customer="عبد القادر" --dry-run
            echo "=== APPLY ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan syna:repair-sales-return-credit --customer="عبد القادر"
            echo "=== VERIFY invoices + partner balance ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod exec -T backend php artisan tinker --execute='$c=\App\Models\Customer::query()->where("name","like","%عبد القادر%")->first(); if(!$c){echo "CUSTOMER_NOT_FOUND".PHP_EOL; return;} echo "customer_id={$c->id} name={$c->name}".PHP_EOL; $invs=\App\Models\SalesInvoice::query()->where("customer_id",$c->id)->orderBy("id")->get(["id","invoice_number","status","total","paid_amount"]); foreach($invs as $i){ $rem=round((float)$i->total-(float)$i->paid_amount,2); echo "inv#{$i->id} num={$i->invoice_number} status={$i->status} total={$i->total} paid={$i->paid_amount} remaining={$rem}".PHP_EOL; } $bal=app(\App\Services\SalesService::class)->customerBalance($c); echo "customer_balance={$bal}".PHP_EOL;'
